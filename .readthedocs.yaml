# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The `platypus` module is a compiled Rust extension, so the build provisions a
# Rust toolchain and installs the module from `rust/` (maturin is its PEP 517
# build backend). Sphinx/autodoc then imports it to generate the API pages.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"
  # If maturin's manylinux audit ever fails on the RTD builder, add an
  # environment variable in the Read the Docs project settings:
  #   MATURIN_PEP517_ARGS = --skip-auditwheel

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # Builds + installs `platypus` via maturin (PEP 517 backend in rust/pyproject.toml).
    - path: rust
