[package]
name = "platypus-apkbuild"
version = "0.1.0"
edition = "2021"
description = "Repack and sign Android APKs. Pure-Rust implementation of APK Signature Scheme v2 + v1 JAR signing, with zipalign and self-signed key generation. Pairs with the rest of project-platypus to round-trip an APK through analysis → modification → install-ready package."

[lib]
name = "platypus_apkbuild"
path = "src/lib.rs"

[[bin]]
name = "platypus-apkbuild"
path = "src/bin/cli.rs"

[dependencies]
# Read the original APK + walk its central directory. We don't write the
# output with this crate — signing requires byte-exact control of the
# offsets — but read access is well-supported here.
zip          = { version = "2", default-features = false, features = ["deflate"] }
# Crypto primitives.
sha2         = "0.10"
sha1         = "0.10"
rsa          = { version = "0.9", features = ["sha2"] }
rand         = "0.8"
# X.509 + DER plumbing for v1's PKCS#7 SignedData + v2's certificate bytes.
x509-cert    = { version = "0.2", features = ["pem"] }
der          = { version = "0.7", features = ["pem", "alloc", "derive"] }
spki         = "0.7"
# Self-signed cert / private-key generation for `keygen`. We use the
# resulting key for *signing* via the `rsa` crate; rcgen handles the
# cert encoding so we don't have to hand-build a TBSCertificate.
rcgen        = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
# Time for cert validity windows.
time         = { version = "0.3", features = ["std"] }
# Misc.
byteorder    = "1"
thiserror    = "2"
base64       = "0.22"
# PKCS#12 keystore loading (.p12 / .pfx). For .jks (Java KeyStore)
# the keytool conversion is: keytool -importkeystore -srckeystore foo.jks
# -destkeystore foo.p12 -deststoretype PKCS12 — then we read the .p12.
p12-keystore = "0.2"
