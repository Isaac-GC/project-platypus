[package]
name = "project-platypus-ui"
version = "0.1.0"
description = "Project Platypus - Android Reverse Engineering Tool"
authors = ["Project Platypus"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "project_platypus_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "project-platypus-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
# ── Self-update ────────────────────────────────────────────────────────────
# `updater` does the actual check-and-install flow against the endpoint
# configured in `tauri.conf.json -> plugins.updater`. `process` is what
# lets the frontend `relaunch()` the app after a successful install.
# Both are no-ops at runtime if the frontend never calls them.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Offline Ed25519 license verification (shared with the `platypus` Python module).
platypus-license = { path = "../../rust/platypus-license" }
# kill_script uses libc::kill on Unix to send SIGTERM to the python3 subprocess.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
tempfile = "3"
project_platypus_native = { path = "../../rust" }
platypus-dexmapper      = { path = "../../rust/platypus-dexmapper", features = ["rehydrate"] }
sha2 = "0.10"

urlencoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
