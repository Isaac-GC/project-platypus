[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-gnu]
# `cc` is the standard C compiler driver (gcc/clang) present on any Linux with
# a C toolchain installed — portable across distros. The previous value was the
# bare target triple, which is not an actual linker binary and broke native
# Linux builds (`linker 'x86_64-unknown-linux-gnu' not found`).
linker = "cc"