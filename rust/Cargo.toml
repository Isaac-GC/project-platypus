[workspace]
members = [".", "platypus-apk", "platypus-dex", "platypus-vm", "platypus-codegen", "platypus-resources", "platypus-rehydrate", "platypus-dexmapper", "platypus-unpackers", "platypus-license", "platypus-apkbuild", "platypus-crypto"]
resolver = "2"


[package]
name = "project_platypus_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "project_platypus_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "platypus"
path = "src/main.rs"

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
platypus-apk    = { path = "platypus-apk" }
platypus-dex    = { path = "platypus-dex" }
platypus-vm     = { path = "platypus-vm" }
platypus-codegen = { path = "platypus-codegen" }
platypus-resources = { path = "platypus-resources" }
platypus-rehydrate = { path = "platypus-rehydrate" }
platypus-dexmapper = { path = "platypus-dexmapper" }
platypus-license   = { path = "platypus-license" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
