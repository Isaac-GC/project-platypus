[package]
name = "platypus-dexmapper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone loader for dexmapper deobfuscation mappings (ProGuard / JSON). Resolves obfuscated class, method, and field names back to their library originals. Optional integration with platypus-rehydrate (behind the `rehydrate` feature) lets the activity-viewer show real names instead of R8 single-letter aliases."

[lib]
name = "platypus_dexmapper"
path = "src/lib.rs"

[[bin]]
name = "platypus-dexmapper"
path = "src/bin/cli.rs"

[features]
# Default build is *standalone* — no workspace deps. The library exposes
# mapping parsing, lookup, and JVM-ref translation; the CLI exposes
# `info`, `lookup-class`, `lookup-method`, `translate-ref`.
default = []
# Enables `Deobfuscator::apply_to_activity_view` and the CLI's `apply`
# subcommand. Pulls in `platypus-rehydrate` for the `ActivityView` IR.
# Both Tauri shells in this repo turn this on.
rehydrate = ["dep:platypus-rehydrate"]
# Enables the *producer* pipeline — JVM .class bytecode parser, SQLite
# index, smali/java source parsers, multi-tier matcher, Maven downloader
# + POM resolver, indexer, mapping writer, in-place patcher. Adds the
# `index`, `index-local`, `index-batch`, `analyze`, `patch`, `stats`,
# `artifacts`, `lookup`, and `match-method` CLI subcommands. Pulls in
# rusqlite, ureq, quick-xml, regex, walkdir, sha2, zip.
producer = [
    "dep:rusqlite",
    "dep:ureq",
    "dep:quick-xml",
    "dep:regex",
    "dep:walkdir",
    "dep:sha2",
    "dep:zip",
    "dep:hex",
    # DEX + APK handling — lets the producer index from `.dex` / `.apk`
    # files directly (in addition to JAR/AAR) and match obfuscated DEX
    # classes without going through baksmali / jadx.
    "dep:platypus-dex",
    "dep:platypus-apk",
]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
platypus-rehydrate = { path = "../platypus-rehydrate", optional = true }

# ── Producer-feature deps ─────────────────────────────────────────────────
# All optional — pulled in only when `--features producer` is on. Pin
# minor versions because the producer build downloads from Maven Central
# at runtime and we want predictable TLS / HTTP behaviour.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
ureq     = { version = "2.10", features = ["tls"],    optional = true, default-features = false }
quick-xml = { version = "0.36",                        optional = true }
regex     = { version = "1.10",                        optional = true }
walkdir   = { version = "2.5",                         optional = true }
sha2      = { version = "0.10",                        optional = true }
zip       = { version = "2",                           optional = true }
hex       = { version = "0.4",                         optional = true }
platypus-dex = { path = "../platypus-dex",             optional = true }
platypus-apk = { path = "../platypus-apk",             optional = true }
