[package]
name = "platypus-license"
version = "0.1.0"
edition = "2021"
description = "Offline, Ed25519-signed license-token verification for Project Platypus (node-locked)."
license = "MIT"

[lib]
name = "platypus_license"

[features]
# `sign` pulls in the private-key signing path. It is OFF by default so the
# shipped client (Tauri app / Python module) only ever carries the *verifier*
# and the public key — never code that touches a private key. Vendor tooling
# (the keygen CLI) and the round-trip tests enable it explicitly.
default = []
sign = []

[dependencies]
# Verification core. ed25519-dalek v2 gives us `verify_strict`, which rejects
# the malleable / small-order-point edge cases that plain `verify` accepts.
ed25519-dalek = "2"
# Stable per-machine id for the node-lock (IOPlatformUUID / machine-id / MachineGuid).
machine-uid = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Tests exercise the signing path against the verifier.
platypus-license = { path = ".", features = ["sign"] }
