[package]
name        = "platypus-unpackers"
version     = "0.1.0"
edition     = "2021"
description = "Static dumpers for Android packers (Jiagu/Qihoo, FengYue, Ijiami, DexShield, Virbox)."

[lib]
name = "platypus_unpackers"
path = "src/lib.rs"

[[bin]]
name = "platypus-unpack"
path = "src/bin/unpack.rs"

[dependencies]
# Zip + xapk handling. `deflate` enables the standard `Deflate` decoder
# (every real APK uses deflate or store; bzip2/zstd are vanishingly rare).
zip       = { version = "2", default-features = false, features = ["deflate"] }
flate2    = "1"

# Hashing.
sha2      = "0.10"
# SHA-1 needed for the Jiagu synthetic-DEX signature.
sha1      = "0.10"

# Crypto: AES-128-CBC for FengYue — internal, dependency-free.
platypus-crypto = { path = "../platypus-crypto" }

# Serialization for manifest.json output.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Binary parsing — little-endian struct reads (matches Python `struct.unpack("<...")`).
byteorder = "1"

# CLI for the `platypus-unpack` binary.
clap      = { version = "4", features = ["derive"] }
anyhow    = "1"

# Regex for filename matching (mirrors the Python detector patterns 1:1).
regex     = "1"

# DEX reading — reuse the existing crate for adler32 / DEX header parsing
# where possible. Optional for v1 but keeps the door open.
platypus-dex = { path = "../platypus-dex" }
