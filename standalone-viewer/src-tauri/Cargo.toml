[package]
name = "platypus-viewer"
version = "0.1.0"
edition = "2021"
description = "Standalone Android activity viewer — load any APK, see its activity layouts. Reuses the platypus-rehydrate backend and the @platypus/activity-viewer React component."

[lib]
name = "platypus_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "platypus-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = [] }
tauri-plugin-dialog  = "2"
# ── Self-update ────────────────────────────────────────────────────────────
# `updater` does the actual check-and-install flow against the endpoint
# configured in `tauri.conf.json -> plugins.updater`. `process` is what
# lets the frontend `relaunch()` the app after a successful install.
# Both are no-ops at runtime if the frontend never calls them, so they
# carry zero cost for users who don't have a network connection.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
tokio                = { version = "1", features = ["full"] }
project_platypus_native = { path = "../../rust" }
platypus-dexmapper      = { path = "../../rust/platypus-dexmapper", features = ["rehydrate"] }
platypus-rehydrate      = { path = "../../rust/platypus-rehydrate" }
