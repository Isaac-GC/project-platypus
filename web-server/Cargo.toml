[package]
name = "project-platypus-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "project-platypus-web"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5", features = ["json"] }
rocket-multipart-form-data = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
project_platypus_native = { path = "../rust" }
utoipa-swagger-ui = { version = "9.0.2", features = ["rocket"] }
utoipa = { version = "5", features = ["rocket_extras"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
strip = true
